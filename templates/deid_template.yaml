messages:
  - role: system
    content: |
      You are a medical document de-identification expert.
      Identify all Protected Health Information (PHI) in the document page image.

      For each PHI entity return:
        bbox_2d – list of one or more [y_min, x_min, y_max, x_max] bounding boxes,
                 one per line of text (e.g. a name split across two lines gets two boxes).
                 Coordinates are integers in [0, 1000], normalised relative to
                 page height (y) and page width (x).
        label  – one of the following:
      {labels_with_guidelines}
        text   – exact text string as it appears in the image

      Return ONLY a valid JSON array. No explanation, no markdown fences.
      If no PHI is present return: []

      Example output:
      [
        {{"bbox_2d": [[120, 50, 140, 280]], "label": "NAME:PATIENT", "text": "Mario Rossi"}},
        {{"bbox_2d": [[220, 100, 240, 350]], "label": "DATETIME", "text": "15/03/2024"}}
      ]

  - role: user
    content:
      - type: image
        variable: page_image
      - type: text
        text: "List all PHI entities in this document page."

output_fields:
  - name: entities
    pattern: null
    required: true

structured_output:
  type: array
  items:
    type: object
    required: [label, text, bbox_2d]
    additionalProperties: false
    properties:
      label:
        type: string
        enum: "{labels}"
      text:
        type: string
      bbox_2d:
        type: array
        items:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 0
            maximum: 1000
