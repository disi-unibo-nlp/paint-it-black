run_name: inference_run
log_level: INFO
seed: 42

# Dataset
input_dataset: data/test_ds
input_split: base
output_dir: output/inference

# Prompt template
template: templates/deid_template_guided.yaml

# Backend — run_vllm_inference.sh sets base_url automatically;
# set manually here only when connecting to an already-running server.
backend: vllm
model: Qwen/Qwen3-VL-2B-Thinking
base_url: http://localhost:8000/v1
api_key: EMPTY
max_new_tokens: 16384
timeout: 600
batch_size: 8
max_retries: 3
# Qwen3 thinking-mode recommended values (https://huggingface.co/Qwen/Qwen3-8B)
# DO NOT set temperature=0 for thinking models — causes endless repetition.
temperature: 0.6
top_p: 0.95
top_k: 20
enable_thinking: true

# Structured outputs
guided_json: false

# Evaluation
iou_thresholds: [0.25, 0.5, 0.75]

# Tracking
wandb: true
