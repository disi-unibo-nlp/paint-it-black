# Example: folding
# Visible fold creases — common in hospital forms stored in physical folders.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/folding

run_name: example_folding
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/augmentation_elements/folding/
num_augmentations: 3
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
folding_p: 1.0
folding_fold_count: 3
folding_fold_noise: 0.02
folding_gradient_width: [0.1, 0.25]         # slightly wider crease for visibility
folding_gradient_height: [0.01, 0.03]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
