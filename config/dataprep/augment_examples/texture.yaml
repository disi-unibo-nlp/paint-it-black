# Example: texture
# Paper grain + uneven brightness — simulates coarse recycled paper and scanner lamp variation.
# Applied as an AugmentationSequence: noise_texturize always followed by brightness_texturize.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/texture

run_name: texture
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/augmentation_elements
num_augmentations: 3
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
texture_p: 1.0
texture_noise_sigma_range: [1, 12]           # coarser grain for clear demo
texture_noise_turbulence_range: [1, 6]
texture_brightness_texturize_range: [0.1, 0.98]   # wider brightness variation
texture_brightness_deviation: 0.05

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
