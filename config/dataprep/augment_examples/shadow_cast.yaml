# Example: shadow_cast
# Dark shadow from a book spine or hand partially blocking the scanner bed.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/shadow_cast

run_name: example_shadow_cast
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/augmentation_elements/shadow_cast/
num_augmentations: 3
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
shadow_cast_p: 1.0
shadow_cast_side: random
shadow_cast_vertices_range: [2, 8]
shadow_cast_width_range: [0.2, 0.55]
shadow_cast_height_range: [0.2, 0.55]
shadow_cast_opacity_range: [0.3, 0.65]      # stronger opacity for clear demo
shadow_cast_iterations_range: [1, 2]
shadow_cast_blur_kernel_range: [101, 301]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
