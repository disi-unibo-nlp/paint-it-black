# high_noise: annotations
# Markup only — anchored to detected text lines so markings are always realistic.
# Scribbles removed: it draws random words/strokes unrelated to text position.
# markup_sampling=1: type is sampled per image (highlight/strikethrough/underline/crossed)
#   and a realistic color is resolved per ink type.
# markup_ink_weights=[0,0,0,1]: always highlighter ink.
# highlighter_colors: yellow
# markup_length_range [1.0, 1.0]: always covers the full detected line width.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise/annotations

run_name: annotations_highlighter
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/low_noise
num_augmentations: 8
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
annotations_p: 1.0
annotations_markup: 1
annotations_markup_sampling: 1
annotations_markup_large_word_mode: 1
annotations_markup_single_word_mode: 0
annotations_markup_repetitions: [1, 1]
annotations_markup_ink_weights: [0.0, 0.0, 0.0, 1.0] # pencil, pen, marker, highlighter
annotations_markup_type_weights: [0.0, 0.0, 0.0, 1.0]
annotations_markup_num_lines_range: [5, 20]
annotations_markup_length_range: [1.0, 1.0]
annotations_markup_highlighter_thickness_range: [1, 1]
annotations_markup_highlighter_colors: [255, 255, 0, 0, 255, 255, 255, 0, 255, 255, 192, 203] # yellow, blue, purple, pink
annotations_markup_control_points_range: [2, 3] # control points per stroke; fewer = straighter
annotations_markup_line_offset: 3               # y-jitter per point in pixels
annotations_scribbles: 0

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
faxify_p: 0.0
