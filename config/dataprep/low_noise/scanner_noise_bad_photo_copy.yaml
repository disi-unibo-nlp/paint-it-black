# low_noise: scanner_noise — bad_photo_copy only
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/low_noise/scanner_noise_bad_photo_copy --flat

run_name: scanner_noise_bad_photo_copy
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/low_noise
num_augmentations: 8
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
scanner_noise_p: 1.0
scanner_noise_bad_photo_copy: 1
scanner_noise_bad_photo_copy_noise_type: 1
scanner_noise_bad_photo_copy_noise_side: random
scanner_noise_bad_photo_copy_noise_iter: [1, 3]
scanner_noise_bad_photo_copy_noise_size: [1, 1]
scanner_noise_bad_photo_copy_noise_value: [60, 100]
scanner_noise_bad_photo_copy_sparsity: [0.3, 0.7]
scanner_noise_bad_photo_copy_concentration: [0.2, 0.6]
scanner_noise_bad_photo_copy_blur_noise: -1
scanner_noise_bad_photo_copy_wave_pattern: -1
scanner_noise_bad_photo_copy_edge_effect: -1

scanner_noise_dirty_rollers: 0
scanner_noise_dirty_drum: 0
scanner_noise_dirty_screen: 0

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
texture_p: 0.0
color_paper_p: 0.0
stains_p: 0.0
watermark_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
