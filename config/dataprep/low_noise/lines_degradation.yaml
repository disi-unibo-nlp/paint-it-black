# Example: lines_degradation
# Breaks up printed form rules and ruled lines — simulates worn or faded line work.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/lines_degradation

run_name: lines_degradation
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/low_noise
num_augmentations: 6
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
lines_degradation_p: 1.0
lines_degradation_gradient_range: [32, 255]
lines_degradation_gradient_direction: [0, 2]
lines_degradation_split_probability: [0.2, 0.4]
lines_degradation_replacement_value: [250, 255]
lines_degradation_replacement_probability: [0.4, 0.5]
lines_degradation_min_length: [30, 40]
lines_degradation_long_to_short_ratio: [5, 7]
lines_degradation_replacement_thickness: [1, 3]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
