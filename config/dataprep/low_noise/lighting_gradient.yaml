# Example: lighting_gradient
# Uneven scanner lamp illumination — one side of the page is darker than the other.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/lighting_gradient

run_name: lighting_gradient
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/low_noise
num_augmentations: 3
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
lighting_gradient_p: 1.0
lighting_gradient_max_brightness: 255
lighting_gradient_min_brightness: 50
lighting_gradient_mode: gaussian    # gaussian | linear
lighting_gradient_transparency: 0.90  # fixes random.uniform(0.5,0.85) default which causes extreme dimming

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
