# Example: color_paper
# Ages and yellows the paper background — typical of hospital chart paper stored over time.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/color_paper

run_name: color_paper
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/low_noise
num_augmentations: 6
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
color_paper_p: 1.0
color_paper_num_profiles: 2
color_paper_profile_weights: [0.5, 0.5]
color_paper_profile_hue_ranges: [15, 20, 18, 50]
color_paper_profile_saturation_ranges: [25, 40, 5, 20]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
