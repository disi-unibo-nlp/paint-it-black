# Example: final_mix
# Mix of various low-noise augmentations.
# All other augmentations are disabled so the effect is isolated.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/examples/final_mix

run_name: final_mix
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/low_noise
num_augmentations: 10
dpi: 300

# ── color paper ─────────────────────────────────────────────────────────────────
color_paper_p: 0.7
color_paper_page_sampling: 1
color_paper_num_profiles: 3
color_paper_profile_weights: [0.5, 0.5]
color_paper_profile_hue_ranges: [18, 50, 18, 50]
color_paper_profile_saturation_ranges: [5, 20, 15, 35]

# ── ink bleed ─────────────────────────────────────────────────────────────────
ink_bleed_p: 1.0
ink_bleed_intensity_range: [0.70, 1.00]
ink_bleed_kernel_size: [3, 6]
ink_bleed_severity: [0.38, 0.85]

# ── ink mottling ─────────────────────────────────────────────────────────────────
ink_mottling_p: 0.5
ink_mottling_alpha_range: [0.12, 0.20]
ink_mottling_noise_scale_range: [2, 6]
ink_mottling_gaussian_kernel_range: [3, 11]

# ── lighting gradient ─────────────────────────────────────────────────────────────────
lighting_gradient_p: 1.0
lighting_gradient_max_brightness: 255
lighting_gradient_min_brightness: 50
lighting_gradient_mode: gaussian    # gaussian | linear
lighting_gradient_transparency: 0.90  # fixes random.uniform(0.5,0.85) default which causes extreme dimming

# ── low ink ─────────────────────────────────────────────────────────────────
low_ink_p: 1.0
low_ink_random_lines: 1
low_ink_random_lines_count_range: [2, 5]
low_ink_random_lines_consistent: 0
low_ink_random_lines_noise_prob: 0.5
low_ink_periodic_lines: 1
low_ink_periodic_lines_count_range: [1, 3]
low_ink_periodic_lines_period_range: [5, 12]
low_ink_periodic_lines_consistent: 0
low_ink_periodic_lines_noise_prob: 0.5

# ── lines degradation ─────────────────────────────────────────────────────────────────
lines_degradation_p: 1.0
lines_degradation_gradient_range: [32, 255]
lines_degradation_gradient_direction: [0, 2]
lines_degradation_split_probability: [0.2, 0.6]
lines_degradation_replacement_value: [250, 255]
lines_degradation_replacement_probability: [0.4, 0.5]
lines_degradation_min_length: [30, 40]
lines_degradation_long_to_short_ratio: [5, 7]
lines_degradation_replacement_thickness: [1, 3]

# ── subtle noise ─────────────────────────────────────────────────────────────────
subtle_noise_p: 1.0
subtle_noise_page_sampling: 1
subtle_noise_num_profiles: 2
subtle_noise_profile_weights: [0.5, 0.5]
subtle_noise_profile_ranges:  [18, 35]

# ── disabled ──────────────────────────────────────────────────────────────────
bleed_through_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
