# high_noise_mix: low_ink
# Heavy faded toner / low-ink streaks — more lines, tighter banding than low_noise.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise_mix/low_ink

run_name: low_ink
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/high_noise
num_augmentations: 3
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
low_ink_p: 1.0
low_ink_random_lines: 1
low_ink_random_lines_count_range: [3, 8]
low_ink_random_lines_consistent: 0
low_ink_random_lines_noise_prob: 0.5
low_ink_periodic_lines: 1
low_ink_periodic_lines_count_range: [3, 6]
low_ink_periodic_lines_period_range: [3, 8]
low_ink_periodic_lines_consistent: 0
low_ink_periodic_lines_noise_prob: 0.5

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
