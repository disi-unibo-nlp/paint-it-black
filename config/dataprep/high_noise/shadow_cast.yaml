# high_noise: shadow_cast
# Page-edge shadow — wider parameter ranges than defaults for more variability.
# Can produce anything from a thin sliver (width=0.05) to a deep shadow (width=0.90).
# Opacity [0.05, 0.60]: near-invisible to moderately dark.
# Blur kernel [51, 401]: can be soft-edged or very diffuse.
# Up to 3 iterations to allow layered shadows.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise/shadow_cast

run_name: shadow_cast
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/high_noise
num_augmentations: 6
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
shadow_cast_p: 1.0
shadow_cast_side: random
shadow_cast_vertices_range: [2, 12]
shadow_cast_width_range: [0.05, 0.90]
shadow_cast_height_range: [0.05, 0.70]
shadow_cast_opacity_range: [0.05, 0.60]
shadow_cast_iterations_range: [1, 3]
shadow_cast_blur_kernel_range: [51, 401]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
