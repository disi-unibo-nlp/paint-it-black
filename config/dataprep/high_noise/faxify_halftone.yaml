# high_noise: faxify — halftone only
# Profile 1 (halftone-only) always selected: applies halftone dot pattern.
# Tune: half_kernel_size (dot coarseness), angle (screen angle), sigma (dot blur).
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise/faxify_halftone

run_name: faxify_halftone
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/high_noise
num_augmentations: 6
dpi: 300

# ── showcased ─────────────────────────────────────────────────────────────────
faxify_p: 1.0
faxify_profile_sampling: 1
faxify_profile_weights: [0.0, 1.0, 0.0] # mono-only, halftone-only, both
faxify_scale_range: [0.2, 1.8]
faxify_monochrome_methods: [threshold_li, threshold_mean, threshold_otsu, threshold_sauvola, threshold_triangle]
faxify_half_kernel_size: [1, 1]
faxify_angle: [0, 360]
faxify_sigma: [1.0, 3.0]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
