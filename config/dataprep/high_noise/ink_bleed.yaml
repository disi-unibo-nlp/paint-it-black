# high_noise_mix: ink_bleed
# Heavy ink spread into paper fibres — simulates very absorbent or wet hospital paper.
# Higher severity and larger kernels than the low_noise variant.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise_mix/ink_bleed

run_name: ink_bleed
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/high_noise
num_augmentations: 6
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
ink_bleed_p: 1.0
ink_bleed_intensity_range: [0.65, 0.90]
ink_bleed_kernel_size: [3, 8]
ink_bleed_severity: [0.40, 0.70]

# ── disabled ──────────────────────────────────────────────────────────────────
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
