# high_noise_mix: subtle_noise
# Page-level sampling across three scanner noise profiles: light, medium, heavy.
# Each augmented image draws one profile, so the dataset covers a wide noise range
# rather than fixing every copy to the same noise level.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise_mix/subtle_noise

run_name: subtle_noise
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/high_noise
num_augmentations: 6
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
subtle_noise_p: 1.0
subtle_noise_page_sampling: 1
subtle_noise_num_profiles: 2
subtle_noise_profile_weights: [0.50, 0.50]
#                              low_noise_mix  stronger
subtle_noise_profile_ranges:  [18,            30]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
faxify_p: 0.0
