# high_noise: faxify
# Fax transmission artifacts with profile-level sampling across three effect modes.
# Each augmented image draws one profile:
#   0 = monochrome only  (33%)
#   1 = halftone only    (34%)
#   2 = both             (33%)
# The "no effect" case (neither) is never sampled.
# Run: ./scripts/run_cont.sh python3 src/dataprep/augment_pdfs.py --config dataprep/high_noise/faxify

run_name: faxify
log_level: INFO
seed: 42
input_dir: ./data/example_input
output_dir: ./output/high_noise
num_augmentations: 6
dpi: 200

# ── showcased ─────────────────────────────────────────────────────────────────
faxify_p: 1.0
faxify_profile_sampling: 1
faxify_profile_weights: [0.33, 0.34, 0.33]
#                        mono-only  halftone-only  both
faxify_scale_range: [0.2, 2.0]
faxify_monochrome_method: random
faxify_half_kernel_size: [1, 1]
faxify_angle: [0, 360]
faxify_sigma: [1.0, 3.0]

# ── disabled ──────────────────────────────────────────────────────────────────
ink_bleed_p: 0.0
bleed_through_p: 0.0
low_ink_p: 0.0
ink_mottling_p: 0.0
lines_degradation_p: 0.0
color_paper_p: 0.0
texture_p: 0.0
stains_p: 0.0
watermark_p: 0.0
scanner_noise_p: 0.0
geometric_p: 0.0
lighting_gradient_p: 0.0
shadow_cast_p: 0.0
exposure_p: 0.0
subtle_noise_p: 0.0
jpeg_p: 0.0
folding_p: 0.0
page_border_p: 0.0
annotations_p: 0.0
